<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 430">

    <defs>

        <!-- White metallic cloud -->
        <linearGradient id="cloudMetal"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">

            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="50%" stop-color="#d8d8dd"/>
            <stop offset="100%" stop-color="#ffffff"/>

        </linearGradient>


        <!-- Red gradient -->
        <linearGradient id="redGradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">

            <stop offset="0%" stop-color="#ff596d"/>
            <stop offset="50%" stop-color="#ff1f3d"/>
            <stop offset="100%" stop-color="#b80025"/>

        </linearGradient>


        <!-- Glow -->
        <filter id="redGlow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

            <feGaussianBlur
                stdDeviation="6"
                result="blur"/>

            <feMerge>

                <feMergeNode in="blur"/>

                <feMergeNode in="SourceGraphic"/>

            </feMerge>

        </filter>

    </defs>


    <!-- =========================
         CLOUD
         ========================= -->

    <path
        d="
        M115 300
        C65 300 40 265 40 225

        C40 180 75 145 120 145

        C140 90 190 55 245 70

        C280 25 345 20 385 55

        C420 40 465 55 490 90

        C530 95 560 130 560 170

        C560 220 525 255 480 255

        L115 300
        Z
        "

        fill="#060608"

        stroke="url(#cloudMetal)"

        stroke-width="14"

        stroke-linejoin="round"
    />


    <!-- =========================
         RED SNAKE GLOW
         ========================= -->

    <path
        d="
        M70 210

        C130 145 170 270 235 205

        C300 140 335 120 390 185

        C445 250 480 275 535 185
        "

        fill="none"

        stroke="#ff1738"

        stroke-width="15"

        stroke-linecap="round"

        opacity="0.35"

        filter="url(#redGlow)">

        <animate
            attributeName="d"

            dur="2.8s"

            repeatCount="indefinite"

            values="
            
            M70 210
            C130 145 170 270 235 205
            C300 140 335 120 390 185
            C445 250 480 275 535 185;

            M70 220
            C130 275 175 135 235 215
            C300 290 335 115 390 175
            C445 115 485 255 535 195;

            M70 210
            C130 145 170 270 235 205
            C300 140 335 120 390 185
            C445 250 480 275 535 185
            "
        />

    </path>


    <!-- =========================
         RED SNAKE MAIN LINE
         ========================= -->

    <path
        d="
        M70 210

        C130 145 170 270 235 205

        C300 140 335 120 390 185

        C445 250 480 275 535 185
        "

        fill="none"

        stroke="#ff3048"

        stroke-width="6"

        stroke-linecap="round"

        filter="url(#redGlow)">

        <animate
            attributeName="d"

            dur="2.8s"

            repeatCount="indefinite"

            values="

            M70 210
            C130 145 170 270 235 205
            C300 140 335 120 390 185
            C445 250 480 275 535 185;

            M70 220
            C130 275 175 135 235 215
            C300 290 335 115 390 175
            C445 115 485 255 535 195;

            M70 210
            C130 145 170 270 235 205
            C300 140 335 120 390 185
            C445 250 480 275 535 185

            "
        />

    </path>


    <!-- =========================
         CENTER V
         ========================= -->

    <path
        d="
        M205 160

        L270 275

        L330 275

        L395 160

        L350 160

        L300 235

        L250 160

        Z
        "

        fill="url(#redGradient)"

        stroke="#ff4055"

        stroke-width="3"

        stroke-linejoin="round"

        filter="url(#redGlow)"
    />

</svg>